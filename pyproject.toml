[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlpilot-agent"
version = "0.2.5"
description = "SQLPilot SQL Review Engine for MaxCompute / DataWorks"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=28.0.0,<29.0.0",
    "qdrant-client>=1.15,<2",
    "langgraph>=1,<2",
]

[tool.setuptools.packages.find]
include = ["sql_pilot_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
