name: V1 Release Gate

on:
  push:
    branches:
      - main
      - v1-release-hardening-20260913
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: |
          python -m pytest \
            tests/test_metadata_models.py \
            tests/test_sqlite_metadata_repository.py \
            tests/test_metadata_ingestion_excel.py \
            tests/test_metadata_rebuild.py \
            -q

  evidence:
    name: Program + Evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python -m compileall -q sql_pilot_engine tests examples
      - run: |
          python -c "from sql_pilot_engine.evidence import LineageEvidenceResolver, SQLGlotDerivedLineageAdapter, OptimizerHintEvidenceExtractor; print('evidence import ok')"
      - run: |
          python -m pytest \
            tests/test_program_metadata_evidence.py \
            tests/test_hint_evidence.py \
            tests/test_lineage_evidence.py \
            tests/test_lineage_resolver.py \
            -q

  generation:
    name: Generation + Schema Linking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: |
          python -m pytest \
            tests/test_generation.py \
            tests/test_metric_compiler.py \
            tests/test_schema_linker.py \
            tests/test_sql_generator_linked_schema.py \
            -q

  narrow_warehouse:
    name: Narrow Warehouse V1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python examples/narrow_warehouse_demo.py

  text_to_sql_rules:
    name: Text-to-SQL Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python -m pytest tests/test_text_to_sql_semantic_rules.py -q

  trusted_sql:
    name: Trusted SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python -m pytest tests/test_trusted_sql_workflow.py -q
      - run: python -m sql_pilot_engine.cli examples/metadata_check.sql --format text

  text_to_sql_demo:
    name: Text-to-SQL Offline Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - run: python examples/text_to_sql_demo.py --no-use-real-llm

  simulator:
    name: Simulator / PySpark 4.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[simulation]" pytest
      - run: |
          python -m pytest \
            tests/test_maxcompute_local.py \
            tests/test_maxcompute_local_compatibility.py \
            tests/test_maxcompute_production_shape.py \
            -q --capture=sys
